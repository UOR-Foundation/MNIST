# The model gate: the LexLean compiler at the commit lexlean.lock was taken against, the Lean
# toolchain lean-toolchain pins, and `just model-verify` followed by the conformance tests. It
# does not depend on the PrismPM SDK binding (bootstrap.yml), which the template does not yet
# have; it is the gate that protects this repository's own claims.
name: model

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LEXLEAN_REPOSITORY: UOR-Foundation/LexLean
  # The LexLean commit this project's bundle was produced by; dist/result.json names it.
  LEXLEAN_COMMIT: 54f2ec4145fb62604f14e7938b3d89673b32c731

jobs:
  model:
    name: model / lexlean verify, production replay, conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out LexLean at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.LEXLEAN_REPOSITORY }}
          ref: ${{ env.LEXLEAN_COMMIT }}
          path: .lexlean-src
          persist-credentials: false
      - name: Install the Rust toolchain the repository pins
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt,clippy
      - name: Install the Lean toolchain lean-toolchain pins
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Report the installed toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice::toolchains: $(ls "$HOME/.elan/toolchains" | tr '\n' ' '); lean: $(lean --version); lake: $(lake --version | head -n 1); bin: $(ls "$HOME/.elan/toolchains/$(ls "$HOME/.elan/toolchains" | head -n 1)/bin" | tr '\n' ' ')"
      - name: Cache the LexLean build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .lexlean-src/target/release/lexlean
          key: lexlean-${{ env.LEXLEAN_COMMIT }}-${{ runner.os }}
      - name: Build the pinned LexLean
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x .lexlean-src/target/release/lexlean ]; then
            (cd .lexlean-src && cargo build --release -p lexlean --bin lexlean)
          fi
          echo "$PWD/.lexlean-src/target/release" >> "$GITHUB_PATH"
      # Each command's output is kept and, on failure, repeated as a workflow
      # error annotation, so the diagnostic is readable from the run's summary
      # and through the API without the raw log.
      - name: Verify the model
        shell: bash
        run: |
          set -euo pipefail
          gate() {
            out="$RUNNER_TEMP/gate.out"
            "$@" > "$out" 2>&1 && code=0 || code=$?
            cat "$out"
            if [ "$code" -ne 0 ]; then
              echo "::error::$* exited $code: $(tr '\n' ' ' < "$out" | cut -c1-3000)"
              exit "$code"
            fi
          }
          gate lexlean lock --check
          gate lexlean fmt --check --all
          gate lexlean check --all
          gate lexlean build --all
          gate lexlean verify --all
      - name: Replay the committed bundle and run the conformance suite
        shell: bash
        run: |
          set -euo pipefail
          gate() {
            out="$RUNNER_TEMP/gate.out"
            "$@" > "$out" 2>&1 && code=0 || code=$?
            cat "$out"
            if [ "$code" -ne 0 ]; then
              echo "::error::$* exited $code: $(tr '\n' ' ' < "$out" | tail -c 3000)"
              exit "$code"
            fi
          }
          gate lexlean production verify-artifact dist
          gate cargo xtask check-model
          gate cargo clippy --workspace --all-targets -- -D warnings
          gate cargo test --workspace
