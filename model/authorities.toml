# model/authorities.toml --- what this repository cites rather than proves.
#
# A `some-true` claim is reproduced from an authority and is not established
# here. This file is where the authority is named well enough for a third party
# to find it, with a checksum over the committed artifact when there is one and
# a stated reason when there is not.
#
# `realized_by` lists the conformance IDs that are *evidence* this repository
# realizes the cited fact. Evidence is not proof, and the meta-gate fails the
# build if any document blurs the two registers.

spec = "template/1"

[[authority]]
id = "ONNX-MNIST-12-INT8"
name = "ONNX Model Zoo, MNIST-12-int8"
citation = "github.com/onnx/models, validated/vision/classification/mnist/model/mnist-12-int8.onnx (MIT); CNTK-trained MNIST CNN quantized with Intel Neural Compressor; README states 1.1% top-1 error"
checksum = "sha256:5eac0752eecf4991a5e4157cf31a186f2c61090494019e87979ac17df1dae253"
statement = "The int8 weights, biases, scales and zero points under src/Mnist are this model's initializers; the graph is QuantizeLinear, QLinearConv 5x5 SAME 1->8 + bias, MaxPool 2x2, QLinearConv 5x5 SAME 8->16 + bias, DequantizeLinear, MaxPool 3x3, Reshape, QuantizeLinear, QLinearMatMul 256x10, QLinearAdd, DequantizeLinear."
realized_by = ["MN-01", "MN-02"]

[[authority]]
id = "ONNX-MNIST-12-FP32"
name = "ONNX Model Zoo, MNIST-12"
citation = "github.com/onnx/models, validated/vision/classification/mnist/model/mnist-12.onnx (MIT); the float32 model the int8 model was quantized from"
