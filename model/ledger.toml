# model/ledger.toml --- the honesty ledger for claims that are not conformance
# IDs (R2).
#
# The conformance IDs and their levels live in `model/ids.toml`, which is the
# register; duplicating them here would give a claim two sources, which is
# exactly what R1 forbids. What remains is the two kinds of claim that have no
# ID: the facts this repository *reproduces* from an authority, and the
# quantities it *measures* and never asserts.
#
# The meta-gate proves the suite never asserts an `open` claim as established,
# and `CM-03` proves every `some-true` row cites an authority that exists.

spec = "template/1"

[[claim]]
id = "AUTH-01"
level = "some-true"
statement = "MNIST-12 reaches 1.1% top-1 error on the MNIST test set, as the ONNX Model Zoo README reports."
authority = "ONNX-MNIST-12-INT8"

[[claim]]
id = "OPEN-01"
level = "open"
statement = "Measured over the 10,000-image MNIST test set, the certified rust-std rendering of classify chose the same class as onnxruntime 1.29.0 running mnist-12-int8.onnx on every image, and the same class as onnxruntime running mnist-12.onnx on 99.65% of images; see docs/evidence/head-to-head.md."
sample_size = 10000

[[claim]]
id = "OPEN-02"
level = "open"
statement = "Measured on one 2-vCPU container, the certified rust-std rendering of classify took 7.7 ms per image with the same work count (39,944 steps) on every image, against 66 us for onnxruntime on the same int8 graph; before LexLean #87 the same graph took 28.7 ms; see docs/evidence/head-to-head.md."
sample_size = 10000

[[claim]]
id = "OPEN-03"
level = "open"
statement = "Measured on the certified crate with five mechanical rewrites of its rendering only (field projection, buffer lists, borrowed projections, fold as a loop, initial capacity), the same graph ran at 4.8 ms per image with identical predictions and the same 39,944 steps; the first three landed in LexLean as #87 (closing #81) and give the 7.7 ms of OPEN-02, the rest are LexLean #84; see docs/evidence/rendering.md."
sample_size = 2000
