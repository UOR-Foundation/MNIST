[package]
name = "repo-conformance"
description = "The BDD runner and the honesty meta-gate. Dev and CI only; never a dependency of a shipped crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
repo-model = { workspace = true }

[dev-dependencies]
# MN-05 decompresses the committed IDX fixtures and builds the bundle's package in a scratch
# workspace; MN-06 digests the artifacts. Dev only: nothing here is shipped.
flate2 = "1.1.2"
sha2 = "0.11.1"
tempfile = "3.20.0"

[lints]
workspace = true
